<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --fg: #fff; --dim: #aaa; --bg: #202020; --hover: rgba(255,255,255,.08); --accent: #f03; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg); user-select: none; cursor: default;
    font: 13px "Segoe UI Variable Text", "Segoe UI", sans-serif;
    padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px;
  }
  .top { display: flex; gap: 12px; align-items: center; min-width: 0; }
  #art { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; background: #333; flex: none; cursor: pointer; }
  .meta { flex: 1; min-width: 0; }
  #title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 52px; }
  #artist { color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { margin-top: 10px; height: 14px; display: flex; align-items: center; cursor: pointer; }
  .track { position: relative; height: 3px; width: 100%; background: rgba(255,255,255,.2); border-radius: 2px; }
  .bar:hover .track { height: 5px; }
  #fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 2px; }
  .times { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 6px; }
  button {
    border: 0; background: none; color: var(--fg); width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
  button:disabled { opacity: .35; cursor: default; background: none; }
  #toggle { width: 44px; height: 44px; background: var(--fg); color: #000; }
  #toggle:hover { background: #ddd; }
  #open, #hide { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; color: var(--dim); }
  #hide { right: 34px; }
  svg { width: 22px; height: 22px; fill: currentColor; }
  #open svg { width: 16px; height: 16px; }
  #hide svg { width: 20px; height: 20px; }
  .seek text { font: 700 6.5px "Segoe UI", sans-serif; text-anchor: middle; }
</style>
</head>
<body>
  <button id="hide" title="Hide mini player" aria-label="Hide mini player">
    <svg viewBox="0 0 24 24"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
  </button>
  <button id="open" title="Open Pear Lite" aria-label="Open Pear Lite">
    <svg viewBox="0 0 24 24"><path d="M21 11V3h-8l3.29 3.29-10 10L3 13v8h8l-3.29-3.29 10-10z"/></svg>
  </button>
  <div class="top">
    <img id="art" alt="" title="Open Pear Lite">
    <div class="meta">
      <div id="title">Nothing playing</div>
      <div id="artist">Open Pear Lite to pick some music</div>
      <div class="bar" id="bar" title="Seek"><div class="track"><div id="fill"></div></div></div>
      <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>
  </div>
  <div class="controls">
    <button id="prev" title="Previous" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button id="back" class="seek" title="Back 10 seconds" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="15.5">10</text></svg></button>
    <button id="toggle" title="Play" aria-label="Play"><svg viewBox="0 0 24 24"><path id="toggleIcon" d="M8 5v14l11-7z"/></svg></button>
    <button id="forward" class="seek" title="Forward 10 seconds" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="15.5">10</text></svg></button>
    <button id="next" title="Next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const send = (msg) => window.ipc.postMessage(msg);
  const PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
  const fmt = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  };

  // Position is extrapolated locally between updates from the app.
  let st = { playing: false, pos: 0, dur: 0, at: performance.now() };
  const now = () => Math.min(st.dur || Infinity, st.pos + (st.playing ? (performance.now() - st.at) / 1000 : 0));
  function tick() {
    const p = now();
    $('pos').textContent = fmt(p);
    $('fill').style.width = st.dur ? `${(p / st.dur) * 100}%` : '0';
  }
  setInterval(() => { if (st.playing && !document.hidden) tick(); }, 500);

  window.mini = {
    update(s) {
      const has = !!s.title;
      $('title').textContent = has ? s.title : 'Nothing playing';
      $('artist').textContent = has ? s.artist : 'Open Pear Lite to pick some music';
      if (s.art && $('art').getAttribute('src') !== s.art) $('art').src = s.art;
      if (!s.art) $('art').removeAttribute('src');
      for (const id of ['prev', 'back', 'toggle', 'forward', 'next']) $(id).disabled = !has;
      st = { playing: s.playing, pos: s.pos, dur: s.dur, at: performance.now() };
      $('toggleIcon').setAttribute('d', s.playing ? PAUSE : PLAY);
      $('toggle').title = $('toggle').ariaLabel = s.playing ? 'Pause' : 'Play';
      $('dur').textContent = fmt(s.dur);
      tick();
    },
  };

  for (const id of ['prev', 'back', 'toggle', 'forward', 'next', 'open', 'hide']) $(id).onclick = () => send(id);
  $('art').onclick = () => send('open');
  // Everything that isn't a control moves the window.
  document.addEventListener('mousedown', (e) => {
    if (e.button === 0 && !e.target.closest('button, .bar, #art')) send('drag');
  });
  $('bar').onclick = (e) => {
    if (!st.dur) return;
    const r = e.currentTarget.getBoundingClientRect();
    send('seek:' + (((e.clientX - r.left) / r.width) * st.dur).toFixed(1));
  };
  document.addEventListener('keydown', (e) => {
    const keys = { ' ': 'toggle', ArrowLeft: 'back', ArrowRight: 'forward' };
    if (keys[e.key] && !(e.key === ' ' && e.target.tagName === 'BUTTON')) { e.preventDefault(); send(keys[e.key]); }
  });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  send('ready');
</script>
</body>
</html>
