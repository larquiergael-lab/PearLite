[package]
name = "pear-lite"
version = "0.1.0"
edition = "2024"
description = "Lightweight native YouTube Music desktop client (Rust + WebView2), a lean port of pear-desktop"
license = "MIT"

[dependencies]
discord-rich-presence = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = { version = "0.8", default-features = false }
tao = "0.37"
tray-icon = "0.26"
wry = { version = "0.57", default-features = false, features = ["os-webview", "devtools"] }
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
